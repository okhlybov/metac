[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metac"
version = "0.0.1"
description = "C source code generation package"
authors = [{name = "Oleg A. Khlybov", email = "fougas@mail.ru"}]
license = {text = "BSD 3-Clause"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/okhlybov/metac"

[tool.setuptools.package-data]
"*" = [
  "*.md",
  "template/**/*",
  "template/**/.*",
  "template/.vscode/*",
  "template/.vscode/.*"
]